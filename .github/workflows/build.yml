name: Build Spring Boot
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests package
      - name: Unit tests without database
        run: ./mvnw -B -Dtest=PedidoVariantesTest,ProductoVariantesTest,PasswordRecoveryServiceTest,ProbadorConfiguracionTest,AgalazProbadorServiceTest,TryOnCloudProbadorServiceTest,ProbadorCloudinaryTest test
