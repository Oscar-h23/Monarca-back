spring.application.name=Backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=monarca

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
# Recuperación por correo: se activa al configurar estas variables.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
monarca.mail.from=${MAIL_FROM:}
monarca.password-reset-url=${PASSWORD_RESET_URL:}

# Pool prudente para el servicio en Supabase.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=1

# Token de prueba TryOn Labs, solo en entorno backend.
monarca.tryon.token=${TRYONLABS_TOKEN:}
# Para ensayos con menor resolución; no equivale a un precio garantizado.
monarca.tryon.resolution=${TRYON_RESOLUTION:1k}
monarca.tryon.generation-mode=${TRYON_GENERATION_MODE:fast}
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
